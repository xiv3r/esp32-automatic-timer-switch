name: Build ESP32 Offline Firmware

on:
  workflow_dispatch:
  release:
    types: [published]
    
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |
        sudo apt update
        sudo apt install wget -y
        wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a
        
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        
        # Install libraries
        arduino-cli lib install "ArduinoJson"
        arduino-cli lib install "PubSubClient"
        git clone --depth 1 --branch 1.14.1 https://github.com/adafruit/RTClib.git ~/Arduino/libraries/RTClib

        # Compile Firmware
        cd OFFLINE/ESP32
        mv *.ino ESP32.ino
        arduino-cli compile --fqbn esp32:esp32:esp32 --clean --output-dir firmware .
        
        # Rename
        rm firmware/*.ino.bin             
        rm firmware/*.ino.bootloader.bin  
        rm firmware/*.ino.partitions.bin
        
        mv firmware/*.ino.merged.bin      firmware/esp32-dump-0x0.bin
        
    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="offline"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          OFFLINE/ESP32/firmware/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
