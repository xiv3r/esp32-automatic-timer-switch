name: Flasher

on:
  workflow_dispatch:
  release:
    types: [published]  
    
jobs:
  download-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install Arduino-cli
      run: |
        mkdir -p downloads
        cd downloads
        # wget -O ESPFlash.xapk "https://d-13.winudf.com/b/XAPK/aW8uc2VyaWFsZmxvdy5lc3BmbGFzaF80MV8zZTQ3YTBmZA?_fn=RVNQRmxhc2gtRVNQMzIvRVNQODI2NkZsYXNoZXJfMS4yLjlfQVBLUHVyZS54YXBr&_p=aW8uc2VyaWFsZmxvdy5lc3BmbGFzaA%3D%3D&download_id=no_1594906870222671&is_hot=false&k=e6d7cefaa935e3df40d8bb7ea5830c2069deee65"
        # wget -O ArduinoDroid_Premium_v7.4.1.apk --no-check-certificate "https://fs21.uploadrar.com:183/d/mtswakczamubi775osh6zkmizzyxmyawe7tdygeigpg2fa3cfzixac7ylijj6evybkjoye4g/ArduinoDroid-Arduino-ESPIDEv7.4.1b872arm648.0_edbyyouarefinished-a2zapk.io.apk"
        # wget -O Arduino_2.3.8_winx64.exe "https://github.com/arduino/arduino-ide/releases/download/2.3.8/arduino-ide_2.3.8_Windows_64bit.exe"
        # wget https://github.com/arduino/arduino-ide/releases/download/2.3.10/arduino-ide_2.3.10_Linux_64bit.AppImage
        # wget https://github.com/arduino/arduino-ide/releases/download/2.3.10/arduino-ide_2.3.10_Windows_64bit.exe
        # wget https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        wget --no-check-certificate https://data.winudf.com/XAPK/aW8uc2VyaWFsZmxvdy5lc3BmbGFzaF80NV9iYjBiYzRjNg?_p=aW8uc2VyaWFsZmxvdy5lc3BmbGFzaA%3D%3D&download_id=no_1478200724026763&filename=ESPFlash-ESP32%2FESP8266Flasher_1.3.3_APKPure.xapk&full_size=11378437&is_hot=false&k=4c62ca314d2ffbfc820cf8d28b2b0edc6a782afb&package_name=io.serialflow.espflash&source=web&token=1786087419-65af9f1652-0-92e2d9c03fb5a331c83b32baa132e21f
        wget --no-check-certificate https://data.winudf.com/XAPK/aW8uc2VyaWFsZmxvdy5lc3BmbGFzaF80NV9iYjBiYzRjNg?_p=aW8uc2VyaWFsZmxvdy5lc3BmbGFzaA%3D%3D&download_id=1753807636379542&filename=ESPFlash-ESP32%2FESP8266Flasher_1.3.3_APKPure.xapk&full_size=11378437&is_hot=false&k=204d73c413a1780641e30ba125ed40dd6a782b7a&package_name=io.serialflow.espflash&source=web&token=1786087546-8cc755c824-0-2b96b0d92bcd2f98612036c4714c29f7
        
    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="flasher"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          downloads/*.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
